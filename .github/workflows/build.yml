name: Build frpc for iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build frpc for jailbroken iOS
        shell: bash
        run: |
          set -euxo pipefail

          export GOOS=ios
          export GOARCH=arm64
          export CGO_ENABLED=0

          # Build a pure-Go binary so the executable does not link against
          # host/iPhoneOS libc resolver libraries such as libresolv.
          go build \
            -tags netgo,osusergo \
            -trimpath \
            -ldflags="-s -w" \
            -o frpc-ios-arm64 \
            ./cmd/frpc

          echo '=== binary info ==='
          file frpc-ios-arm64
          otool -L frpc-ios-arm64 || true
          vtool -show-build frpc-ios-arm64 || true

          echo '=== verify no problematic dylib dependency ==='
          if otool -L frpc-ios-arm64 2>/dev/null | grep -E '/usr/lib/libresolv|/usr/lib/libSystem|CoreFoundation|Security'; then
            echo 'Unexpected Apple dylib dependency found'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frpc-ios-arm64
          path: frpc-ios-arm64
