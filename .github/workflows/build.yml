name: Build frpc for iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build frpc for jailbroken iOS
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"

          cat > /tmp/ios-clang <<EOF
          #!/bin/bash
          exec "$CLANG" -isysroot "$SDK" -target arm64-apple-ios12.0 "\$@"
          EOF
          chmod +x /tmp/ios-clang

          export GOOS=ios
          export GOARCH=arm64
          export CGO_ENABLED=1
          export CC=/tmp/ios-clang
          export CGO_CFLAGS="-isysroot $SDK -target arm64-apple-ios12.0"
          export CGO_LDFLAGS="-isysroot $SDK -target arm64-apple-ios12.0"

          # Keep cgo enabled because Go's ios/arm64 port requires external linking.
          # Force Go's DNS resolver and os/user implementations where possible so
          # frpc itself avoids resolver lookups through libresolv at runtime.
          go build \
            -tags netgo,osusergo \
            -trimpath \
            -ldflags="-s -w" \
            -o frpc-ios-arm64 \
            ./cmd/frpc

          echo '=== binary info ==='
          file frpc-ios-arm64
          otool -L frpc-ios-arm64
          vtool -show-build frpc-ios-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: frpc-ios-arm64
          path: frpc-ios-arm64
